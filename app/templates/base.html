<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta property="og:title" content="Personal Portfolio">
    <meta property="og:description" content="My Personal Portfolio">
    <meta property="og:url" content="{{ url }}">

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/monitor.css') }}">
    <link rel='icon' href="{{ url_for('static', filename='img/favicon.ico') }}" type='image/x-icon' />
    <title>{{ title }}</title>
</head>

<body>
    <!-- chrome + recessed screen backdrop -->
    <canvas id="monitor-canvas"></canvas>

    <!-- frame furniture: fixed, sits on the chrome -->
    <div class="frame frame-logo">
        <a href="{{ url_for('index') }}">sage<span>.ebert</span></a>
    </div>

    <div class="frame frame-title">{{ title }}</div>

    <nav class="frame frame-menu" aria-label="Primary">
        <span class="menu-label">Menu</span>
        {% for link in links %}
        <a href="{{ url_for(link.endpoint) }}">{{ link.name }}</a>
        {% endfor %}
    </nav>

    <div class="frame frame-contact">
        {% for c in contact %}
        <a href="{{ c.href }}"{% if c.href.startswith('http') %} target="_blank" rel="noopener"{% endif %}>{{ c.label }}</a>
        {% endfor %}
    </div>

    <div class="frame frame-stumble">
        <button type="button" id="stumble-btn"
                data-links='[{% for link in links %}"{{ url_for(link.endpoint) }}"{% if not loop.last %},{% endif %}{% endfor %}]'
                aria-label="Stumble to a random page" title="Stumble">
            <svg viewBox="0 0 68 68"><path id="stumble-path" fill="none" stroke="#7d3fc4" stroke-width="5" stroke-linecap="round"/></svg>
        </button>
    </div>

    <!-- the monitor: content lives here and scrolls left/right -->
    <div id="screen">
        <div class="screen-track">
            <article class="panel">
                {% block content %}{% endblock %}
            </article>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/monitor.js') }}"></script>
</body>

</html>
